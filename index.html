<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QC Inspection Stamping</title>
<meta name="description" content="QC Inspection Stamping Plant-2 - inspeksi quality gate dan periodic check">
<meta name="theme-color" content="#0F1418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QC Gate">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #0F1418; --panel: #182027; --line: #2A3540; --fg: #E6EDF2; --mut: #9FB0BD; --acc: #F2B233; --ng: #FF7A59; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .layar { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; background: var(--bg); z-index: 5; transition: opacity .35s; }
  .layar.hilang { opacity: 0; pointer-events: none; }
  [hidden] { display: none !important; }
  .layar img { width: 132px; height: 132px; }
  .layar h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  .layar p { margin: 0; color: var(--mut); font-size: 14px; max-width: 420px; line-height: 1.5; }
  .putar { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--acc); animation: putar 0.9s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }
  .btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 12px 18px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; min-width: 220px; }
  .btn.pri { background: var(--acc); border-color: var(--acc); color: #1A1300; }
  code { background: var(--panel); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  #pasang { position: fixed; right: 16px; bottom: 16px; z-index: 8; display: none; min-width: 0; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="muat" class="layar" role="status">
  <img src="icon-512.png" alt="Logo Quality Gate">
  <h1>QC INSPECTION · STAMPING</h1>
  <div class="putar" id="putar" aria-hidden="true"></div>
  <p id="muat-teks">Memuat aplikasi…</p>
  <div id="gagal" hidden style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <button id="ulang" class="btn pri" type="button">Coba lagi</button>
    <button id="langsung" class="btn" type="button">Buka lewat browser</button>
  </div>
</div>
<div id="atur" class="layar" hidden>
  <img src="icon-512.png" alt="Logo Quality Gate">
  <h1>URL aplikasi belum diisi</h1>
  <p>Buka file <code>index.html</code> di GitHub, isi <code>URL_APP</code> dengan URL web app Apps Script yang berakhiran <code>/exec</code>, lalu simpan (Commit).</p>
</div>
<iframe id="app" title="QC Inspection Stamping" allow="camera; fullscreen; clipboard-write" allowfullscreen></iframe>
<button id="pasang" class="btn pri" type="button">Pasang aplikasi</button>

<script>
  /* ====== ISI DENGAN URL WEB APP APPS SCRIPT (Deploy > Manage deployments > Web app URL) ====== */
  const URL_APP = 'https://script.google.com/macros/s/AKfycbzL_4Fz6fi3vZqyF3kb0aOTDX3kTzN3jW0umR_tyUECuOCkZ7haNgdgXRwg1XQLD3MyNw/exec';
  /* ========================================================================================== */

  /* Versi 6. Aplikasi QC dijalankan langsung di halaman ini (bukan membuka script.google.com):
     isi aplikasi diambil dari Apps Script (?kode=1), dan setiap simpan / muat data dikirim ke URL /exec
     TANPA cookie akun Google. Karena itu HP yang masuk banyak akun Google tetap bisa membuka aplikasi.
     Salinan aplikasi disimpan di HP, jadi aplikasi tetap terbuka walau sinyal putus (inspeksi masuk antrean). */
  const frame = document.getElementById('app'), muat = document.getElementById('muat'), teks = document.getElementById('muat-teks');
  const URL_BERSIH = (() => { const u = String(URL_APP).trim(), i = u.lastIndexOf('https://script.google.com/'); return i > 0 ? u.slice(i) : u; })();
  const urlValid = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(URL_BERSIH) || window.QC_UJI_API;
  const API = window.QC_UJI_API || URL_BERSIH;
  const SIMPAN = 'qc_kode_aplikasi';
  const simpan = s => { try { localStorage.setItem(SIMPAN, s); } catch (e) { /* memori browser penuh: tetap jalan tanpa salinan */ } };
  const ambilSimpan = () => { try { return localStorage.getItem(SIMPAN) || ''; } catch (e) { return ''; } };
  const kodeSah = s => typeof s === 'string' && s.indexOf('QC Inspection Stamping') >= 0 && s.indexOf('QCCore') >= 0;

  function jalankan(kode) {
    const awal = '<script>window.QC_API=' + JSON.stringify(API) + ';window.QC_QS=' + JSON.stringify({ search: location.search, hash: location.hash }) + ';<\/script>';
    const html = kode.replace('<base target="_top">', '').replace(/<head>/i, '<head>' + awal);
    frame.onload = () => { muat.classList.add('hilang'); setTimeout(() => { muat.hidden = true; }, 400); };
    frame.srcdoc = html;
  }
  function gagal(pesan) {
    document.getElementById('putar').hidden = true;
    teks.textContent = pesan;
    document.getElementById('gagal').hidden = false;
  }
  async function mulai() {
    document.getElementById('gagal').hidden = true; document.getElementById('putar').hidden = false; teks.textContent = 'Memuat aplikasi…';
    const lama = ambilSimpan();
    try {
      const res = await fetch(API + (API.indexOf('?') >= 0 ? '&' : '?') + 'kode=1&t=' + Date.now(), { credentials: 'omit', cache: 'no-store', redirect: 'follow' });
      const kode = await res.text();
      if (!res.ok || !kodeSah(kode)) throw new Error('isi tidak dikenal');
      if (kode !== lama) simpan(kode);
      jalankan(kode);
    } catch (e) {
      /* Tidak ada sinyal, atau Code.gs belum versi terbaru: pakai salinan terakhir bila ada. */
      if (kodeSah(lama)) { jalankan(lama); return; }
      gagal(navigator.onLine === false ? 'Tidak ada koneksi internet. Sambungkan HP ke internet lalu coba lagi.' : 'Aplikasi belum bisa dimuat. Pastikan Code.gs di Apps Script sudah versi terbaru (ada ?kode=1) dan sudah Deploy versi baru.');
    }
  }

  if (!urlValid) {
    muat.hidden = true;
    document.getElementById('atur').hidden = false;
    const t = document.createElement('p'); t.style.wordBreak = 'break-all'; t.textContent = 'Terbaca sekarang: ' + URL_BERSIH; document.getElementById('atur').appendChild(t);
    frame.remove();
  } else if (new URLSearchParams(location.search).get('mode') === 'langsung') {
    location.replace(URL_BERSIH + location.search.replace(/([?&])mode=langsung&?/, '$1').replace(/[?&]$/, '') + location.hash);
  } else {
    document.getElementById('ulang').addEventListener('click', mulai);
    document.getElementById('langsung').addEventListener('click', () => { location.href = URL_BERSIH + location.search + location.hash; });
    mulai();
  }

  /* Tombol "Pasang aplikasi" (Android / Chrome / Edge). Di iPhone: Bagikan > Tambah ke Layar Utama. */
  let tawaran = null;
  const pasang = document.getElementById('pasang');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); tawaran = e; pasang.style.display = 'block'; });
  pasang.addEventListener('click', async () => { if (!tawaran) return; tawaran.prompt(); await tawaran.userChoice; tawaran = null; pasang.style.display = 'none'; });
  window.addEventListener('appinstalled', () => { pasang.style.display = 'none'; });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
